// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Capacitor 7 libraries ask for Java 21 sources. When Gradle runs on an older JDK (this machine has 17), compile
// everything at the running JDK's level instead; the code does not use Java 21 features. Not needed on JDK 21+.
if (JavaVersion.current() < JavaVersion.VERSION_21) {
    subprojects { sub ->
        sub.afterEvaluate {
            if (sub.extensions.findByName('android')) {
                sub.android.compileOptions {
                    sourceCompatibility JavaVersion.current()
                    targetCompatibility JavaVersion.current()
                }
            }
        }
    }
}
