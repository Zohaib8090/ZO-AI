# Render blueprint for the Zohara Agent server (public, multi-user). The secrets are typed into Render by the owner; they are never in this repository.
#
# Plan: "free" (the owner's choice for the first launch). Known limits: the instance spins down after 15 minutes without
# inbound traffic (the server's self-ping every 8 minutes tries to prevent that; add an external pinger on /healthz if it
# still sleeps), the disk is wiped at every restart (Firestore is the source of truth, so chats are safe), 512 MB RAM,
# and Render may suspend a free service for heavy outbound traffic; see docs/PUBLIC.md.
# When real users arrive, change this line to "starter" (about 7 USD/month, always on) or "standard" (about 25 USD/month, 2 GB RAM).
# Region: frankfurt keeps the server near the EU Firestore database (eur3).
services:
  - type: web
    name: zo-ai-server
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT   # the whole service account key file (JSON), pasted as one value
        sync: false
      - key: ZO_PUBLIC_URL              # NOT a secret. The owner MUST change this to the real Render address after the first deploy
        value: https://zohara-agent.duckdns.org   # (e.g. https://my-name.onrender.com, no path). It is the base of the sign-in approval link <address>/device.
                                        # RENDER_EXTERNAL_URL (set by Render) is the fallback if this is empty; the server stops at start if neither is valid.
      - key: ZO_ADMIN_EMAILS            # YOUR Google address(es), comma separated: admins get every tool, everybody else is restricted
        sync: false
      - key: ZO_CONTACT_EMAIL           # shown in the privacy notice and the terms: people reach you here for access and deletion requests
        sync: false
      - key: ZO_OPERATOR_COUNTRY        # whose law the terms name, for example Germany
        sync: false
      - key: ZO_HOSTING_REGION          # where this server runs, shown in the privacy notice (matches region above)
        value: Frankfurt, Germany
      - key: ZO_SERVER_SECRET           # per-user API keys are encrypted with a key derived from this; keep a private copy
        generateValue: true
      - key: ZO_MAX_USERS               # registrations allowed (Spark-sized; raise it only after moving Firebase to Blaze)
        value: '200'
      - key: ZO_MAX_RUNS                # answers running at the same time. 512 MB of RAM (free and starter) is tight: keep it at 2 to 4
        value: '2'
      - key: ZO_TENANT_ROOT             # per-user working folders (a cache: Firestore is the source of truth)
        value: /home/zo/tenants
      - key: CLAUDE_CODE_OAUTH_TOKEN    # optional, admin only: from `claude setup-token`, for Claude Code mode for the owner
        sync: false
    # Optional, not set here: ZO_BLOCKED_EMAILS (comma list of addresses refused at sign-in).
    # The server's self-ping (every 8 minutes) matters on the free plan; a paid instance does not sleep.
    # ZO_ACCESS_TOKEN no longer exists: the desktop app and `zo` sign in (docs/LOGIN.md); the server issues their device credentials.
    # Firebase console: Authentication > Sign-in method needs Google and Email/Password on, and the Render address under Authorized domains.
