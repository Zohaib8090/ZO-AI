[workspace]
resolver = "2"
members = ["crates/zo-core", "crates/zo-mcp", "crates/zohara-chat", "crates/zo-server", "crates/zo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# tiny_http with a read timeout on client connections (see vendor/tiny_http/ZOHARA-CHAT-PATCH.md)
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
