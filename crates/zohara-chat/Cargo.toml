[package]
name = "zohara-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zohara Chat — the OS-level AI module for Zohara OS"

[[bin]]
name = "zohara-chat"
path = "src/main.rs"

# the old command name: a hint, then it starts zohara-chat
[[bin]]
name = "zo-ai"
path = "src/bin/zo-ai.rs"

[dependencies]
zo-core = { path = "../zo-core" }
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_6"] }
glib = "0.20"
webkit6 = "0.4"
serde.workspace = true
serde_json.workspace = true
